# ==================================================
# Server Configuration
# ==================================================
server.port=8080

# ==================================================
# MySQL Datasource Configuration
# ==================================================
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:user123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==================================================
# Spring Data JPA Configuration
# ==================================================
# ddl-auto=none means Hibernate will not create or update tables.
# The schema must be prepared separately for local development.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================================================
# Jackson Configuration
# ==================================================
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false

# ==================================================
# Logging Configuration
# ==================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

